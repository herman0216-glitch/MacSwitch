name: MacSwitch
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  MacSwitch:
    type: application
    platform: macOS
    sources:
      - path: MacSwitch
        excludes: [Resources/Info.plist]
      - path: LICENSE
        buildPhase: resources
    info:
      path: MacSwitch/Resources/Info.plist
      properties:
        CFBundleDisplayName: MacSwitch
        CFBundleShortVersionString: "1.1.1"
        CFBundleVersion: "3"
        LSUIElement: true
        NSPrincipalClass: NSApplication
        NSAudioCaptureUsageDescription: MacSwitch 仅在开启应用音量控制时，在本机内存中处理正在播放的应用音频以调节音量，不保存或上传音频。
        NSDesktopFolderUsageDescription: MacSwitch 仅在开启“隐藏桌面图标”时读取桌面项目列表并设置或清除隐藏标记，不读取、移动或上传文件内容。
        NSHighResolutionCapable: true
        LSApplicationCategoryType: public.app-category.utilities
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.herman.MacSwitch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
  MacSwitchTests:
    type: bundle.unit-test
    platform: macOS
    sources: [MacSwitchTests]
    dependencies:
      - target: MacSwitch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.herman.MacSwitchTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MacSwitch:
    build:
      targets:
        MacSwitch: all
        MacSwitchTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [MacSwitchTests]
      gatherCoverageData: true
      parallelizable: false
    archive:
      config: Release
